# Example config for scripts/run_comparison.py.
# Usage:
#   python scripts/run_comparison.py --config config/compare.yaml

methods:
  - base
  - shared_mlp
  - temporal_phase_prior
  - temporal_z_mlp_p

common:
  features_dir: /workspace/results/phase_progress_probe/features_random200_base30ep_balanced
  advantages_path: /workspace/datasets/recap_libero10_task0/libero10_task0_train/meta/advantages_base30ep_random200_logits_phase_dist.parquet
  output_dir: /workspace/results/z_p_correct/comparison_random200
  num_phases: 5
  num_bins: 201
  return_min: -700.0
  return_max: 0.0
  batch_size: 256
  head_lr: 1e-3
  head_max_epochs: 200
  head_early_stop_patience: 20
  fusion_lr: 1e-3
  fusion_max_epochs: 200
  fusion_early_stop_patience: 20
  weight_decay: 1e-4
  device: cuda
  seed: 42

# Method-specific overrides matching the original strict fusion suite defaults.
method_overrides:
  shared_mlp:
    head_hidden_dim: 640
    head_trunk_depth: 6
    head_dropout: 0.1
    label_smoothing: 0.05
    global_progress_loss_weight: 0.25
  temporal_phase_prior:
    head_window_size: 5
    head_num_layers: 2
    head_num_heads: 4
    head_ffn_dim: 512
    head_stage_embedding_dim: 32
  temporal_z_mlp_p:
    head_window_size: 5
    head_hidden_dim: 336
    head_num_layers: 2
    head_num_heads: 6
    head_ffn_dim: 672
    head_stage_embedding_dim: 64
    head_progress_hidden_dim: 336
    head_progress_depth: 3
