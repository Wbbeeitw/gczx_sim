# Example config for scripts/run_comparison.py.
# Usage:
#   python scripts/run_comparison.py --config config/compare.yaml

methods:
  - base
  - shared_mlp
  - temporal_phase_prior
  - temporal_z_mlp_p

common:
  features_dir: /workspace/results/phase_progress_probe/features_random200_base30ep_balanced
  advantages_path: /workspace/datasets/recap_libero10_task0/libero10_task0_train/meta/advantages_base30ep_random200_logits_phase_dist.parquet
  output_dir: /workspace/results/z_p_correct/comparison_random200
  num_phases: 5
  num_bins: 201
  return_min: -700.0
  return_max: 0.0
  batch_size: 256
  head_lr: 1e-3
  head_max_epochs: 200
  head_early_stop_patience: 20
  fusion_lr: 1e-3
  fusion_max_epochs: 200
  fusion_early_stop_patience: 20
  weight_decay: 1e-4
  device: cuda
  seed: 42

method_overrides:
  temporal_phase_prior:
    head_window_size: 5
    head_num_layers: 2
  temporal_z_mlp_p:
    head_window_size: 5
    head_num_layers: 2
