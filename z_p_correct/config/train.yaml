# Example config for scripts/train_z_p_correct.py.
# Usage:
#   python scripts/train_z_p_correct.py $(cat config/train.yaml | xargs)
# or pass arguments directly on the command line.

head_type: our_phase_progress
features_dir: /workspace/results/z_p_correct/features_random200
advantages_path: /workspace/datasets/recap_libero10_task0/libero10_task0_train/meta/advantages_base30ep_random200_logits_phase_dist.parquet
output_dir: /workspace/results/z_p_correct/runs

num_phases: 5
num_bins: 201
return_min: -1.0
return_max: 0.0

head_hidden_dim: 256
head_dropout: 0.1
head_trunk_depth: 1
head_window_size: 5
head_num_layers: 2
head_num_heads: 4
head_ffn_dim: 512
window_size: 1

fusion_hidden_dim: 256
fusion_depth: 2
fusion_dropout: 0.1
alpha: 1.0

batch_size: 256
num_workers: 0
head_lr: 1e-3
head_max_epochs: 200
head_early_stop_patience: 20
fusion_lr: 1e-3
fusion_max_epochs: 200
fusion_early_stop_patience: 20
weight_decay: 1e-4
device: cuda
seed: 42
