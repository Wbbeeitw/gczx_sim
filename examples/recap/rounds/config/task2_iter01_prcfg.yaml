# Round 1 (bootstrap): LIBERO-Long Task2, PR-CFG.
#
# No previous policy/dataset exists for task2, so this round starts from
# scratch: the SFT pi0.5 policy collects D0 (40 episodes), the critic and
# Policy1 are both trained on that same dataset (bootstrap: merged_dataset
# is forced equal to child_dataset, the merge step is skipped).
#
# Pipeline: collect -> fit_critic (returns -> Value0 -> features -> base ->
# z/p -> fusion -> predict -> compare) -> export_bootstrap (fused advantage
# on all 40 episodes) -> train_policy (Policy1 PR-CFG from SFT base, 500
# steps) -> eval_policy (50 episodes + record).
#
# Usage (inside a container with the same mounts as task1):
#   python examples/recap/rounds/run_round.py \
#     --config examples/recap/rounds/config/task2_iter01_prcfg.yaml --stage all
#   # human audit, then:
#   python examples/recap/rounds/run_round.py \
#     --config examples/recap/rounds/config/task2_iter01_prcfg.yaml \
#     --stage all --confirm-audit

round_id: 1
task: task2
task_id: 2
task_suite_name: libero_10
method: prcfg
repo_root: /workspace/RLinf
bootstrap: true
pipeline: [collect, fit_critic, export_bootstrap, train_policy, eval_policy]

gpu:
  cuda_visible_devices: "0"
  gpu_id: 0

paths:
  base_model: /workspace/models/RLinf-Pi05-LIBERO-SFT
  siglip: /workspace/models/siglip2-so400m-patch14-224
  gemma3: /workspace/models/gemma-3-270m
  tokenizer: /workspace/models/gemma-3-270m
  parent_dataset: /data/libero_long/task2_d0_40
  child_dataset: /data/libero_long/task2_d0_40
  merged_dataset: /data/libero_long/task2_d0_40
  exp_root: /data/libero_long/experiments/task2/iter01_prcfg_s500
  results_root: /workspace/results/experiments/task2/iter01_prcfg_s500
  value_checkpoint: null

datasets:
  # Bootstrap has no parent episodes; the critic dataset is the collection.
  parent_episodes: 0

parent_policy:
  # Empty checkpoint = collect and train start from the SFT base model.
  checkpoint: ""
  label: SFT

tags:
  returns: fail300_d0
  merged_base: task2_d0_base_v0
  child_fused: task2_d0_fused_v0

collect:
  num_episodes: 40
  seed: 20260721
  fps: 10
  action_chunk: 5
  num_steps: 5
  num_steps_wait: 10
  model_type: openpi
  openpi_config_name: pi05_libero
  warmup_before_env: true
  guidance_type: positive
  positive_only_conditional: true
  guidance_scale: 1.0
  negative_guidance_scale: 0.0
  visualize: true

returns:
  failure_reward: -300.0
  gamma: 1.0
  global_min: -900.0
  global_max: 0.0
  num_workers: 64

value:
  steps: 1200
  save_interval: 600
  micro_batch_size: 16
  global_batch_size: 64
  lr: 1.0e-5
  value_lr: 1.0e-4
  lr_warmup_steps: 100
  action_dim: 7
  action_horizon: 10
  critic_expert_variant: gemma_1m

revalue:
  label_name: phase_progress_semantic_trace_task2
  num_phases: 4
  success_phase: 3
  seed: 42
  lookahead_step: 10
  positive_quantile: 0.3
  zp_head_type: temporal_local_stage_gated
  zp_use_class_weights: false
  zp_max_epochs: 100
  zp_early_stop_patience: 10
  fusion_max_epochs: 100
  fusion_early_stop_patience: 10
  fusion_alpha: 1.0
  extract_batch_size: 16
  train_batch_size: 256

policy:
  # Round 1 stays PR-CFG (no FACD), initialized from the SFT base model.
  strategy: csa_residual
  guidance_type: positive
  positive_only_conditional: false
  guidance_scale: 1.0
  negative_guidance_scale: 0.0
  positive_residual_alpha: 0.5
  positive_quantile: 0.3
  unconditional_prob: 0.1
  csa_bottom_quantile: 0.15
  csa_bottom_negative_prob: 0.5
  csa_positive_prompt_prob: 0.85
  csa_weight_lambda: 0.2
  max_steps: 500
  save_interval: 500
  lr_warmup_steps: 50
  global_batch_size: 64
  micro_batch_size: 16
  extra_overrides:
    - actor.model.openpi.train_expert_only=false
    - actor.fsdp_config.use_orig_params=true

eval:
  eval_rollout_epoch: 5
  total_num_envs: 10
  guidance_scale: 1.0
  guidance_type: positive
  positive_only_conditional: true
  negative_guidance_scale: 0.0
  warmup_before_env: true
  save_video: false

results:
  enabled: true
  round_index: 0
  policy_label: Policy1-PR-CFG
  critic_label: Value0-fused
  output_dir: /data/libero_long/experiment_results/task2
  output_name: round0_task2_prcfg_value0
