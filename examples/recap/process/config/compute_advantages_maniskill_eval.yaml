# Compute advantages for SequentialPickCube ManiSkill eval dataset using scratch 5k value model
defaults:
  - model/value@advantage.model

advantage:
  value_checkpoint: /workspace/results/value_sft_maniskill/checkpoints/global_step_5000
  batch_size: 1024
  flush_interval: 256
  num_dataloader_workers_per_gpu: 4
  prefetch_factor: 2
  discount_next_value: true
  positive_quantile: 0.3
  tag: maniskill_eval_5k
  returns_tag: null

  model:
    critic_expert_variant: "gemma_1m"
    tokenizer_path: /workspace/models/gemma-3-270m
    siglip_path: /workspace/models/siglip2-so400m-patch14-224
    gemma3_path: /workspace/models/gemma-3-270m

data:
  model_type: "pi05"
  robot_type: "maniskill"
  train_data_paths:
    - dataset_path: "/workspace/datasets/sequential_pickcube_lerobot"
      robot_type: "maniskill"
      type: "sft"
      weight: 1.0

  advantage_lookahead_step: 10
  gamma: 1.0

distributed:
  enabled: true
  backend: "nccl"
  timeout: 3600

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
