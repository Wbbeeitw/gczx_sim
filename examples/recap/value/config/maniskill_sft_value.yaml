# Usage: python examples/recap/value/train_value.py --config-path config --config-name maniskill_sft_value

defaults:
  - model/value@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/sft/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "value_sft_maniskill"
    logger_backends: ["tensorboard"]

  max_epochs: -1
  max_steps: 5000
  val_check_interval: 500
  save_interval: 5000

data:
  tag: null

  train_data_paths:
    - dataset_path: "/workspace/datasets/sequential_pickcube_lerobot"
      type: "sft"
      weight: 1.0
      robot_type: "maniskill"
      model_type: "pi05"
      episode_start: 0
      episode_end: 20

  eval_data_paths:
    - dataset_path: "/workspace/datasets/sequential_pickcube_lerobot"
      max_samples: 10000
      robot_type: "maniskill"
      model_type: "pi05"
      episode_start: 20
      episode_end: 100

  train_num_workers: 8
  eval_num_workers: 4
  prefetch_factor: 4
  persistent_workers: false
  pin_memory: false
  include_state: true
  gamma: 1.0
  action_horizon: 10
  normalize_to_minus_one_zero: true
  include_next_obs: false
  action_dim: 7
  robot_type: "maniskill"
  model_type: "pi05"
  balance_weights: true
  seed: 42

algorithm:
  adv_type: gae

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 16
  global_batch_size: 128
  seed: 0

  model:
    precision: bf16
    siglip_path: /workspace/models/siglip2-so400m-patch14-224
    gemma3_path: /workspace/models/gemma-3-270m
    tokenizer_path: /workspace/models/gemma-3-270m
    freeze_vlm: false
    action_dim: 7
    action_horizon: 10

  optim:
    lr: 5.0e-5
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1e-10
    clip_grad: 1.0
    lr_scheduler: cosine
    lr_warmup_steps: 200
    total_training_steps: 5000

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: False
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
