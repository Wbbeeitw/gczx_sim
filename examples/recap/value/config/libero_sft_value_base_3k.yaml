defaults:
- model/value@actor.model
- training_backend/fsdp@actor.fsdp_config
- _self_
- override hydra/job_logging: stdout
hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
  - file://${oc.env:REPO_PATH}/examples/sft/config/
cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all
runner:
  task_type: sft
  logger:
    log_path: ../results
    project_name: rlinf
    experiment_name: value_sft
    logger_backends:
    - tensorboard
  max_epochs: -1
  max_steps: 10000
  val_check_interval: 500
  save_interval: 2000
data:
  tag: base_fail300_smoke
  train_data_paths:
  - dataset_path: /workspace/datasets/recap_libero10_task0/libero10_task0_sft
    type: sft
    weight: 1.0
    robot_type: libero
    model_type: pi05
  eval_data_paths:
  - dataset_path: /workspace/datasets/recap_libero10_task0/libero10_task0_eval
    max_samples: 512
    robot_type: libero
    model_type: pi05
  train_num_workers: 8
  eval_num_workers: 4
  prefetch_factor: 4
  persistent_workers: false
  pin_memory: false
  include_state: true
  gamma: 1.0
  action_horizon: 10
  normalize_to_minus_one_zero: true
  include_next_obs: false
  action_dim: 7
  robot_type: libero
  model_type: pi05
  balance_weights: true
  seed: 42
algorithm:
  adv_type: gae
actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 16
  global_batch_size: 128
  seed: 0
  model:
    precision: bf16
    siglip_path: /workspace/models/siglip2-so400m-patch14-224
    gemma3_path: /workspace/models/gemma-3-270m
    tokenizer_path: /workspace/models/gemma-3-270m
    freeze_vlm: false
    action_dim: 7
    action_horizon: 10
  optim:
    lr: 0.0001
    value_lr: 0.0001
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1e-10
    clip_grad: 1.0
    lr_scheduler: cosine
    lr_warmup_steps: 500
    total_training_steps: 10000
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    use_orig_params: false
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
reward:
  use_reward_model: false
critic:
  use_critic_model: false
