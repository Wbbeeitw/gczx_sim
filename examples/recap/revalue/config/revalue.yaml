defaults:
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false

method: shared_mlp_fusion
stage: all

data:
  dataset_path: /home/enine/rlinf_workspace/datasets/recap_libero10_task0/libero10_task0_train
  robot_type: libero
  env_type: libero
  model_type: pi05
  action_dim: 32
  default_prompt: null
  label_name: phase_progress_semantic
  val_episode_ratio: 0.2
  seed: 42
  max_episodes: null
  episode_subset_path: null
  episode_split_path: null

manifest:
  output_path: null
  num_episodes: null
  success_ratio: 0.5
  val_episode_ratio: 0.2
  test_episode_ratio: 0.0
  success_phase: 4
  num_phases: 5
  overwrite: false

value:
  checkpoint: /home/enine/rlinf_workspace/results/value_sft/checkpoints/global_step_5000
  siglip_path: /home/enine/rlinf_workspace/models/siglip2-so400m-patch14-224
  gemma3_path: /home/enine/rlinf_workspace/models/gemma-3-270m
  tokenizer_path: /home/enine/rlinf_workspace/models/gemma-3-270m
  critic_expert_variant: gemma_1m
  num_bins: 201
  v_min: -1.0
  v_max: 0.0

returns:
  # Raw return range used only to map raw returns into the critic value scale.
  global_min: -700.0
  global_max: 0.0
  tag: null
  dataset_type: rollout
  failure_reward: -300.0
  num_workers: 64
  compute: true

base:
  tag: base
  returns_tag: null
  compute_returns: true
  compute_advantages: true
  batch_size: 256
  num_workers_per_gpu: 12
  prefetch_factor: 2
  flush_interval: 256
  max_samples: null

output:
  root: /home/enine/rlinf_workspace/results/revalue/libero_task0_shared_mlp
  features_dir: null
  source_features_dir: null
  zp_dir: null
  fusion_dir: null
  predictions_path: null
  comparison_path: null

zp:
  head_type: temporal_z_mlp_p
  hidden_dim: 256
  dropout: 0.1
  trunk_depth: 1
  window_size: 5
  num_layers: 2
  num_heads: 4
  ffn_dim: 512
  stage_embedding_dim: 32
  progress_hidden_dim: 256
  progress_depth: 2
  lr: 1.0e-3
  weight_decay: 1.0e-4
  max_epochs: 100
  early_stop_patience: 10
  phase_loss_weight: 1.0
  progress_loss_weight: 1.0
  global_progress_loss_weight: 0.25
  label_smoothing: 0.05
  use_class_weights: true
  progress_beta: 0.05
  max_grad_norm: null
  stage_only_epochs: 4
  gt_stage_prior_epochs: 6
  stage_prior_ramp_epochs: 10
  max_pred_stage_prior_weight: 0.7

fusion:
  hidden_dim: 256
  depth: 2
  dropout: 0.1
  alpha: 1.0
  lr: 1.0e-3
  weight_decay: 1.0e-4
  max_epochs: 100
  early_stop_patience: 10

train:
  batch_size: 256
  extract_batch_size: 16
  num_workers: 0
  device: cuda
  seed: 42

recap:
  source_tag: null
  source_advantages_path: null
  output_tag: zp_fused
  lookahead_step: 10
  gamma: 1.0
  positive_quantile: 0.3
  discount_next_value: true
  export_split: train

cfg_train:
  enabled: false
  config_name: libero_cfg_openpi
  advantage_tag: null
  dataset_path: null
  base_model_path: null
  episode_split_path: null
  episode_split_name: train
  experiment_name: revalue_cfg_train
  log_dir: null
  model_type: cfg_model
  openpi_config_name: pi05_libero
  strategy: binary
  guidance_type: positive
  positive_only_conditional: true
  unconditional_prob: 0.1
  negative_guidance_scale: 0.0
  csa_positive_quantile: 0.30
  csa_bottom_quantile: 0.15
  csa_positive_prompt_prob: 0.85
  csa_bottom_negative_prob: 0.50
  csa_weight_lambda: 0.20
  positive_residual_alpha: 0.50
  max_epochs: -1
  max_steps: 5000
  save_interval: 5000
  val_check_interval: -1
  total_training_steps: null
  lr_warmup_steps: null
  global_batch_size: 256
  micro_batch_size: 16
  data_type: rollout
  dataset_weight: 1.0
  python_bin: null
  extra_overrides: []

policy_eval:
  enabled: false
  config_name: libero_10_pi05_sft_eval
  model_path: null
  model_type: openpi
  checkpoint_path: null
  experiment_name: revalue_policy_eval
  log_dir: null
  eval_rollout_epoch: 10
  total_num_envs: 5
  save_video: false
  task_suite_name: null
  task_id_filter: []
  openpi_config_name: pi05_libero
  guidance_type: positive
  positive_only_conditional: true
  negative_guidance_scale: 0.0
  python_bin: null
  extra_overrides: []

rollout_collect:
  enabled: false
  output_dir: null
  model_path: null
  checkpoint_path: null
  model_type: openpi
  openpi_config_name: pi05_libero
  task_suite_name: libero_10
  task_id: 0
  num_episodes: 64
  semantic_trace: false
  semantic_trace_task: task1
  semantic_trace_output_name: semantic_trace_task1
  noise_scale: 0.0
  noise_clip: 0.3
  action_chunk: 5
  num_steps: 5
  num_steps_wait: 10
  seed: 42
  gpu_id: 0
  fps: 10
  overwrite: false
  failure_reward: null
