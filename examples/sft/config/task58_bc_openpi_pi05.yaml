defaults:
  - model/pi0_5@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0-0

runner:
  task_type: sft
  logger:
    log_path: "/workspace/results/boost_sft/task58_bc"
    project_name: rlinf
    experiment_name: "task58_bc"
    logger_backends: ["tensorboard"]

  max_epochs: -1
  max_steps: 450
  val_check_interval: -1
  save_interval: 150

data:
  train_data_paths: "/data/libero_long/libero_task58_replayed_merged"

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 8
  global_batch_size: 64
  seed: 0

  # Override the default values in model/pi0_5
  model:
    precision: null
    model_path: "/workspace/models/RLinf-Pi05-LIBERO-SFT"
    num_action_chunks: 10
    action_dim: 7
    add_value_head: False
    openpi:
      config_name: "pi05_libero"
      detach_critic_input: True
      num_images_in_input: 2

  optim:
    lr: 1.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: 450
    lr_warmup_steps: 30
    lr_scheduler: "cosine"
    num_cycles: 0.5
    min_lr: 1.0e-6

  # Override the default values in training_backend/fsdp
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: False
    gradient_checkpointing: False # for openpi, gradient checkpointing is not supported, please do not change this value
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
